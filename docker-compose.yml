services:
  postgres:
    image: postgres:16-alpine
    container_name: mi-blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: proyecto_blog
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./BD/init-docker.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./BD/datos_prueba.sql:/docker-entrypoint-initdb.d/02-datos_prueba.sql:ro
      - ./BD/migracion-verificacion-correo.sql:/docker-entrypoint-initdb.d/03-migracion-verificacion.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proyecto_blog"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mi-blog-backend
    command: npm run dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: postgres
      DB_PASSWORD: admin
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: proyecto_blog
      DB_SSL: "false"
      PORT: 3002
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET debe definirse en .env}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET debe definirse en .env}
      # Claves oficiales de prueba para el entorno local. Producción se
      # configura por separado en Render.
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      FRONTEND_URL: http://localhost:5174
      SMTP_HOST: ""
      SMTP_PORT: 587
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ""
      BREVO_API_KEY: ""
      BREVO_SENDER_EMAIL: ""
      BREVO_SENDER_NAME: Mi Blog
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3002:3002"
    volumes:
      - ./:/app
      - /app/node_modules

  frontend:
    image: node:20-alpine
    container_name: mi-blog-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_PROXY_TARGET: "http://backend:3002"
      # Debe corresponder con la clave secreta de prueba del backend local.
      # En producción debe sobrescribirse mediante VITE_TURNSTILE_SITE_KEY.
      VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
