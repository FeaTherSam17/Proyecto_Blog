services:
  postgres:
    image: postgres:16-alpine
    container_name: mi-blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: proyecto_blog
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./BD/init-docker.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./BD/datos_prueba.sql:/docker-entrypoint-initdb.d/02-datos_prueba.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proyecto_blog"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mi-blog-app
    command: npm run dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: postgres
      DB_PASSWORD: admin
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: proyecto_blog
      PORT: 3000
      SESSION_SECRET: super_secreto_blog
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules

volumes:
  postgres_data:
