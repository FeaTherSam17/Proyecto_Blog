services:
  postgres:
    image: postgres:16-alpine
    container_name: mi-blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: proyecto_blog
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./BD/init-docker.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./BD/datos_prueba.sql:/docker-entrypoint-initdb.d/02-datos_prueba.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proyecto_blog"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mi-blog-backend
    command: npm run dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: postgres
      DB_PASSWORD: admin
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: proyecto_blog
      PORT: 3002
      SESSION_SECRET: super_secreto_blog
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3002:3002"
    volumes:
      - ./:/app
      - /app/node_modules

  frontend:
    image: node:20-alpine
    container_name: mi-blog-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_PROXY_TARGET: "http://backend:3002"
      VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
