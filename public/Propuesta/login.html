<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso | PROYECTO_BLOG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column" style="min-height: 100vh;">
    <div id="app" class="flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="login-card" style="width: 100%; max-width: 350px;">
            <h2 class="section-title text-center mb-4">Acceso Autor</h2>
            <form action="admin.html">
                <div class="mb-3">
                    <label class="category-tag">Email</label>
                    <input type="email" class="form-control w-100" required>
                </div>
                <div class="mb-4">
                    <label class="category-tag">Contraseña</label>
                    <input type="password" class="form-control w-100" required>
                </div>
                <button type="submit" class="btn-editorial w-100">Entrar</button>
            </form>
        </div>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script>const { createApp } = Vue; createApp({}).mount('#app');</script>
</body>
</html>
