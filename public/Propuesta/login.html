<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Autor | PROYECTO_BLOG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-vh-100 d-flex flex-column">
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="inicio.html">PROYECTO_BLOG</a>
        </div>
    </nav>
    <main class="flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="login-card" style="max-width: 400px; width: 100%;">
            <div class="text-center mb-4">
                <i class="fa-solid fa-user-pen fs-1 mb-3"></i>
                <h2 class="section-title h4">Acceso Autor</h2>
            </div>
            <form action="admin.html">
                <div class="mb-3">
                    <label class="small fw-bold text-uppercase">Email</label>
                    <input type="email" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="small fw-bold text-uppercase">Contraseña</label>
                    <input type="password" class="form-control" required>
                </div>
                <button type="submit" class="btn-editorial w-100">Entrar al Panel</button>
            </form>
        </div>
    </main>
</body>
</html>
