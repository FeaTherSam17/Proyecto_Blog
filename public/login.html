<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso | PROYECTO_BLOG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column" style="min-height: 100vh; background-color: var(--cream-bg);">
    <div id="app" class="flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="login-card" style="width: 100%; max-width: 400px; padding: 3rem 2rem;">
            
            <div class="text-center mb-3">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--dark-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
            
            <h2 class="section-title text-center mb-4" style="font-size: 1.5rem;">ACCESO AUTOR</h2>
            
            <form action="admin.html">
                <div class="mb-3">
                    <label class="category-tag mb-2" style="font-size: 0.75rem;">EMAIL</label>
                    <input type="email" class="form-control w-100" required>
                </div>
                <div class="mb-4">
                    <label class="category-tag mb-2" style="font-size: 0.75rem;">CONTRASEÑA</label>
                    <input type="password" class="form-control w-100" required>
                </div>
                <button type="submit" class="btn-editorial w-100" style="padding: 1rem;">ENTRAR AL PANEL</button>
            </form>
        </div>
    </div>
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="js/vue-app.js"></script>
</body>
</html>
